name: Apply linked-folder performance patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Stage linked-folder performance patch runner'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply and verify patch
        shell: bash
        run: |
          base64 -d .github/omen-linked-perf.patch.gz.b64 | gzip -d > /tmp/omen-linked-perf.patch
          git apply --check /tmp/omen-linked-perf.patch
          git apply /tmp/omen-linked-perf.patch
          node --check app.js
          node --check sw.js
          node --check local/live-update.js
          python3 -m json.tool version.json >/dev/null
          git diff --check
          rm -f .github/omen-linked-perf.patch.gz.b64
          rm -f .github/workflows/apply-linked-folder-perf.yml
          git config user.name 'Static Patch Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Compact linked folders and lazy-load media'
          git push origin HEAD:main

name: Build Plapinator TV

on:
  workflow_dispatch:
  push:
    branches:
      - tv-app
    paths:
      - "android-tv/**"
      - ".github/workflows/plapinator-tv.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Expand TV source bundle
        run: |
          if compgen -G "android-tv/source.part-*" > /dev/null; then
            cat android-tv/source.part-* > android-tv/source.tar.gz
          fi
          if [ -f android-tv/source.tar.gz ]; then
            tar -xzf android-tv/source.tar.gz -C android-tv
          fi

      - name: Build installable debug APK
        working-directory: android-tv
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: omens-plapinator-tv-debug
          path: android-tv/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish direct TV-browser download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android-tv/app/build/outputs/apk/debug/app-debug.apk Omens-Plapinator-TV-v0.2.apk
          if gh release view tv-v0.2 >/dev/null 2>&1; then
            gh release upload tv-v0.2 Omens-Plapinator-TV-v0.2.apk --clobber
          else
            gh release create tv-v0.2 Omens-Plapinator-TV-v0.2.apk \
              --target "$GITHUB_SHA" \
              --title "Omen's Plapinator TV v0.2" \
              --notes "Safari-compatible secure local receiver. Media stays on your TV or local network; no SoundCloud, Tina mode, analytics, or cloud media upload."
          fi

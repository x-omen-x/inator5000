name: Build Plapinator TV

on:
  workflow_dispatch:
  push:
    branches:
      - tv-app
    paths:
      - "android-tv/**"
      - ".github/workflows/plapinator-tv.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Expand TV source bundle
        run: |
          if compgen -G "android-tv/source.part-*" > /dev/null; then
            cat android-tv/source.part-* > android-tv/source.tar.gz
          fi
          if [ -f android-tv/source.tar.gz ]; then
            tar -xzf android-tv/source.tar.gz -C android-tv
          fi

      - name: Apply TV source overlay
        run: |
          if [ -d android-tv/overlay ]; then
            cp -a android-tv/overlay/. android-tv/
          fi

      - name: Patch Sony Android compatibility crash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android-tv/app/src/main/java/dog/phantom/plapinatortv/SecureUploadServer.java')
          s = p.read_text()
          s = s.replace(
              '} catch (Exception ignored) {\n            // A dropped sender must never bring down the TV player.\n        }',
              '} catch (Throwable ignored) {\n            // A malformed/dropped sender or old-runtime linkage failure must never bring down the TV player.\n        }'
          )
          old = '''    private record Request(String method, String path, Map<String, String> headers,\n                           long contentLength, boolean chunked) {}'''
          new = '''    private static final class Request {\n        final String method;\n        final String path;\n        final Map<String, String> headers;\n        final long contentLength;\n        final boolean chunked;\n\n        Request(String method, String path, Map<String, String> headers,\n                long contentLength, boolean chunked) {\n            this.method = method;\n            this.path = path;\n            this.headers = headers;\n            this.contentLength = contentLength;\n            this.chunked = chunked;\n        }\n    }'''
          if old not in s:
              raise SystemExit('Request record pattern not found')
          s = s.replace(old, new)
          p.write_text(s)
          PY

      - name: Build installable debug APK
        working-directory: android-tv
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: omens-plapinator-tv-debug
          path: android-tv/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish direct TV-browser download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android-tv/app/build/outputs/apk/debug/app-debug.apk Omens-Plapinator-TV-v0.3.apk
          if gh release view tv-v0.3 >/dev/null 2>&1; then
            gh release upload tv-v0.3 Omens-Plapinator-TV-v0.3.apk --clobber
          else
            gh release create tv-v0.3 Omens-Plapinator-TV-v0.3.apk \
              --target "$GITHUB_SHA" \
              --title "Omen's Plapinator TV v0.3" \
              --notes "LAN receiver repair with Sony/older-Android compatibility hardening. Media stays on the TV or local network; no SoundCloud, Tina mode, analytics, rendezvous, or cloud media upload."
          fi

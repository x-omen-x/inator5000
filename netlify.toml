[build]
  publish = "."

# Lock the hosted app to its own code and device-local blob URLs. SoundCloud is
# the only intentional third-party exception and receives no local photo,
# video or audio data from the app.
#
# Receiver Mode needs WSS to a user-entered private LAN helper. CSP cannot
# express RFC1918 CIDR ranges, so wss: is permitted here; private-lan.js rejects
# non-local/public helper hosts before constructing the WebSocket and has no
# remote fallback.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'none'; script-src 'self' https://w.soundcloud.com; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; media-src 'self' blob: data:; connect-src 'self' https://w.soundcloud.com wss:; frame-src https://w.soundcloud.com; font-src 'self' data:; worker-src 'self' blob:; manifest-src 'self'; upgrade-insecure-requests"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=(), browsing-topics=(), publickey-credentials-get=(), picture-in-picture=()"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Cross-Origin-Resource-Policy = "same-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# The build manifest is checked once when a document is opened or refreshed.
# It is never polled by an open tab or fetched by a closed installed app.
[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Netlify-CDN-Cache-Control = "public, s-maxage=0, must-revalidate"

# Everything below is content-stable: a font, an image, a clip or a sound only
# ever changes by being replaced under a new name. Caching them for a year
# means a returning visitor re-downloads none of it, which is where most of the
# bandwidth on this site was going.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/local/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/local/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.m4a"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.zip"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Scripts and styles are always requested with a ?v= build tag, so a new build
# is a new URL and a stale copy is unreachable. That makes them safe to hold at
# the edge indefinitely and in the browser for an hour.
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Netlify-CDN-Cache-Control = "public, s-maxage=31536000, stale-while-revalidate=86400"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Netlify-CDN-Cache-Control = "public, s-maxage=31536000, stale-while-revalidate=86400"

# Netlify's matcher treats a leading /* as top-level, so the same rule is
# spelled out for the hot modules that live one directory down.
[[headers]]
  for = "/local/*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Netlify-CDN-Cache-Control = "public, s-maxage=31536000, stale-while-revalidate=86400"

[[headers]]
  for = "/local/*.css"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Netlify-CDN-Cache-Control = "public, s-maxage=31536000, stale-while-revalidate=86400"

# The service worker must never be held: it is the thing that decides what all
# the caching above is allowed to do.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Netlify-CDN-Cache-Control = "public, s-maxage=60"

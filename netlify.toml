[build]
  publish = "."

# The build manifest drives the live-update channel: open instances ask for it
# when they come back to the foreground, and roughly every quarter of an hour
# while they are being looked at. It has to be fresh, but it does not have to
# come from the origin every time — a minute at the edge collapses every open
# tab's poll into one request back here, and the browsers revalidate rather
# than re-download, so a poll that finds nothing new costs an empty 304.
[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Netlify-CDN-Cache-Control = "public, s-maxage=60, stale-while-revalidate=600"

# Everything below is content-stable: a font, an image, a clip or a sound only
# ever changes by being replaced under a new name. Caching them for a year
# means a returning visitor re-downloads none of it, which is where most of the
# bandwidth on this site was going.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/local/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/local/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.m4a"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.zip"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Scripts and styles are always requested with a ?v= build tag, so a new build
# is a new URL and a stale copy is unreachable. That makes them safe to hold at
# the edge indefinitely and in the browser for an hour.
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Netlify-CDN-Cache-Control = "public, s-maxage=31536000, stale-while-revalidate=86400"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Netlify-CDN-Cache-Control = "public, s-maxage=31536000, stale-while-revalidate=86400"

# Netlify's matcher treats a leading /* as top-level, so the same rule is
# spelled out for the hot modules that live one directory down.
[[headers]]
  for = "/local/*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Netlify-CDN-Cache-Control = "public, s-maxage=31536000, stale-while-revalidate=86400"

[[headers]]
  for = "/local/*.css"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Netlify-CDN-Cache-Control = "public, s-maxage=31536000, stale-while-revalidate=86400"

# The service worker must never be held: it is the thing that decides what all
# the caching above is allowed to do.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Netlify-CDN-Cache-Control = "public, s-maxage=60"

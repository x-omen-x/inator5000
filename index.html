<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#032c30"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>Plapinator 9000</title><meta name="description" content="Personal local slideshow lab. Photos, videos, soundtrack, overlays and narration. No media uploads."><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="favicon-v2.png"><link rel="apple-touch-icon" href="apple-touch-icon-v2.png"><link rel="stylesheet" href="styles.css?v=20261010"></head>
<body><main id="libraryView"><header class="glass titlebar"><div class="dots" aria-hidden="true"><i></i><i></i><i></i></div><div class="brand"><span>✧</span><strong>Plapinator 9000</strong><small>LOCAL SLIDESHOW LAB</small></div><button class="round" data-action="fullscreen" aria-label="Fill screen">⤢</button></header>
<div class="workspace"><aside class="glass albums"><button class="album active" data-album="All Media">▦ All Media <span id="totalCount">0</span></button><h2>Albums</h2><div id="albumList"></div><button class="subtle" data-action="relink">↻ Relink saved files</button><p id="fileAccessNote" class="note"></p><p id="offlineStatus" class="note">Preparing offline app…</p><button class="subtle" data-action="update">Check for Update</button></aside>
<section class="center"><nav class="glass actions"><button data-action="add">＋ Add Files</button><button data-action="folder">♧ Link Folder</button><button data-action="settings">☷ Settings</button><details class="menu"><summary>Export ▾</summary><div><button data-action="export-filter">This Album / Filter as ZIP</button><button data-action="export-selected">Selected Media as ZIP</button><button data-action="save-settings">Save Settings</button><button data-action="load-settings">Load Settings</button></div></details><details class="menu"><summary>Library ▾</summary><div><button data-action="remove">Remove Selected Links</button><button data-action="clear">Clear Media Links…</button><button data-action="select-all">Select Filtered Media</button><button data-action="select-none">Deselect All</button><button data-action="legacy-clear">Remove old website’s stored copies…</button></div></details><button class="prominent play" data-action="play">▶ Play Reel</button></nav>
<div class="glass galleryPanel"><div class="galleryToolbar"><div class="segmented" id="tabs"><button class="active" data-tab="All">All</button><button data-tab="Pictures">Pictures</button><button data-tab="Videos">Videos</button></div><input id="search" type="search" placeholder="Search media" aria-label="Search media"></div><div id="gallery" class="gallery" role="list"></div><div id="emptyState" class="empty"><span>▧</span><p>Add local photos, videos, or a folder to begin.</p><small>Your originals stay in place. Nothing is uploaded.</small></div></div>
<footer class="glass status"><span id="status" role="status" aria-live="polite">Ready</span><small id="objectCount">0 OBJECTS</small></footer></section><aside id="mainInspector" class="glass inspector"></aside></div></main>
<section id="reelView" hidden><canvas id="reelCanvas" aria-label="Slideshow"></canvas><div id="textFallback" hidden></div><button class="round reelToggle" data-action="reel-panel" aria-label="Playback controls and slideshow settings">☷</button><aside id="reelPanel" class="glass" hidden><div class="topTransport"><button class="round" data-action="previous" aria-label="Previous">|◀</button><button class="round" id="pauseButton" data-action="pause" aria-label="Pause">Ⅱ</button><button class="round" data-action="next" aria-label="Next">▶|</button><small id="currentName"></small></div><div id="transports"></div><div id="reelInspector" class="inspector"></div><div class="reelActions"><button data-action="record" id="recordButton">● Record</button><button data-action="fullscreen">⤢ Fill Screen</button><button data-action="stop">Exit Reel</button></div><div id="recordingDownload"></div></aside><div id="playbackMessage" role="status"></div></section>
<input id="filesInput" type="file" accept="image/*,video/*,audio/*" multiple hidden><input id="folderInput" type="file" webkitdirectory multiple hidden><input id="audioInput" type="file" accept="audio/*" multiple hidden><input id="overlayInput" type="file" accept="video/*" hidden><input id="settingsInput" type="file" accept="application/json,.json" hidden><video id="mainVideo" playsinline preload="metadata" class="mediaSource"></video><video id="concurrentVideo" playsinline preload="metadata" class="mediaSource"></video><video id="overlayVideo" playsinline preload="metadata" class="mediaSource"></video><audio id="soundtrack" preload="metadata" class="mediaSource"></audio>
<dialog id="notice"><form method="dialog"><h2 id="noticeTitle"></h2><p id="noticeText"></p><button class="prominent">OK</button></form></dialog>
<script src="core.js?v=20261010" defer></script><script src="vendor/jszip.min.js" defer></script><script src="app.js?v=20261010" defer></script></body></html>
